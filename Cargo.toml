[package]
name = "memreduct-rs"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "A lightweight native Windows memory monitor and cleaner inspired by Mem Reduct"
default-run = "memreduct-rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
] }

[[bin]]
name = "memreduct-rs"
path = "src/main.rs"

[[bin]]
name = "memreduct-cli"
path = "src/cli.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
