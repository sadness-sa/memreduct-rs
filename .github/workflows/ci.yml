name: Rust checks and Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Windows'
        run: cargo build --release --locked
      - if: runner.os == 'Windows'
        name: Validate CLI, manifests and native UI
        shell: pwsh
        run: ./scripts/validate-windows.ps1
      - if: runner.os == 'Windows'
        name: Build and test installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -VerifyInstall
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ui-diagnostics
          path: dist/*-preview.png
          if-no-files-found: ignore
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: memreduct-rs-windows-x64-msvc
          path: |
            dist/*-Setup.exe
            dist/SHA256SUMS.txt
            dist/*-preview.png
          if-no-files-found: error
