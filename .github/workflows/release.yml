name: Publish Windows release
on:
  workflow_run:
    workflows: [Rust checks and Windows build]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-windows-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: memreduct-rs-windows-x64-msvc
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Package source and publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          cd dist
          sha256sum -c SHA256SUMS.txt
          cd ..
          git archive --format=zip --prefix="memreduct-rs-$version/" -o "dist/memreduct-rs-$version-source.zip" HEAD
          (cd dist && sha256sum ./*-Setup.exe ./*-source.zip > SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" --target "$(git rev-parse HEAD)" \
            --title "MemReduct RS $tag" --notes-file docs/RELEASE_NOTES.md \
            dist/*-Setup.exe dist/*-source.zip dist/SHA256SUMS.txt
