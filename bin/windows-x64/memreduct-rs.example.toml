# Copy beside both executables as memreduct-rs.toml and launch with --portable.
# Otherwise config is created at %LOCALAPPDATA%\MemReductRs\config.toml.
auto_enabled = false
threshold_percent = 85
hysteresis_percent = 10
sustained_seconds = 10
cooldown_seconds = 300
# 0 disables interval-based cleanup; otherwise 60..86400 seconds.
# Requires auto_enabled=true. Actual interval also respects cooldown_seconds.
interval_seconds = 0
# Applies to the GUI button, tray action and hotkey only. CLI defaults to conservative.
# Automatic cleanup ALWAYS uses conservative, regardless of this field.
manual_profile = "conservative"
start_minimized = false
hotkey_enabled = true
