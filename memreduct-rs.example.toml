# Normal install: %LOCALAPPDATA%\MemReductRs\config.toml
# Optional --portable: memreduct-rs.toml beside executables, in a writable folder.
auto_enabled = false
# memory, interval or either (OR). Interval needs interval_seconds >= 60.
auto_trigger = "memory"
threshold_percent = 85
hysteresis_percent = 10
sustained_seconds = 10
cooldown_seconds = 300
interval_seconds = 0
manual_profile = "smart"
# Smart selects the right non-global strategy from current memory counters.
# Auto permits all strategies except aggressive.
auto_profile = "smart"
skip_fullscreen = true
minimum_working_set_mib = 32
# Exact executable names, case insensitive; foreground process family is always excluded.
process_exclusions = ["obs64.exe", "obs32.exe"]
start_minimized = false
hotkey_enabled = true

# Tray thresholds are independent from the cleanup threshold.
[tray]
dynamic_background = true
warning_percent = 85
danger_percent = 94
normal_background = "#3F69ED"
warning_background = "#C5880D"
danger_background = "#E04C34"
text_color = "#FFFFFF"
